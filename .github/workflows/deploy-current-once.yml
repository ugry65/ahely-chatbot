name: One-time deploy current validated chatbot

on:
  push:
    paths:
      - '.github/workflows/deploy-current-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.head_commit.message == 'Temporary one-time deploy runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate exact current capacity before deploy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          s=Path('ahely_v8.html').read_text(encoding='utf-8')
          expected='var SZABAD_KAPACITAS = [9,15,41]; // 9=Oláh Imre, 15=Spák Brigitta, 41=Lőrincz Noémi'
          if s.count(expected) != 1:
              sys.exit('FAIL: expected validated capacity line not found exactly once')
          spm=re.search(r'var\s+SP\s*=\s*\[(.*?)\n\];\nSP\.forEach',s,re.S)
          ids=[int(x) for x in re.findall(r'\bid\s*:\s*(\d+)',spm.group(1))] if spm else []
          if len(ids)!=32 or len(set(ids))!=32 or 23 in ids or 30 in ids:
              sys.exit('FAIL: SP integrity check failed')
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ahely-chatbot.js').write_text(script,encoding='utf-8')
          print('DEPLOY_VALIDATION_OK')
          PY
          node --check /tmp/ahely-chatbot.js

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload current validated ahely_v8.html via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p $SFTP_PORT sftp://$SFTP_HOST << 'LFTP'
          set sftp:auto-confirm yes
          set net:max-retries 3
          put ahely_v8.html -o /ahely_v8.html
          bye
          LFTP
