name: Deploy ahely_v8.html to server

on:
  push:
    branches:
      - main
    paths:
      - 'ahely_v8.html'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify preinstalled SFTP tools
        run: |
          command -v sshpass
          command -v sftp

      - name: Upload via SFTP and verify
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e sftp -oBatchMode=no -b - -P "$SFTP_PORT" \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=30 -oServerAliveInterval=15 -oServerAliveCountMax=3 \
            "$SFTP_USER@$SFTP_HOST" << 'SFTP'
          ls -l ahely_v8.html
          put ahely_v8.html ahely_v8.html
          ls -l ahely_v8.html
          bye
          SFTP
